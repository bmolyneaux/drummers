<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: liner notes from a drum-history box set — confident, factual, a little loud.
   IDEA: a lineage chart pinned up in a rehearsal room: who learned from whom.
   PICTURE: a left-to-right family tree; top-20 cards in drumhead red, influences in slate.
   COLOUR and TYPE: white ground, near-black ink, oxblood red accent, slate support; Oswald names, Inter text.
   LAYOUT: title band, legend + toggle, the tree (scrolls sideways on phones), then the full table. */
:root{color-scheme:light dark;

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}

.ln{width:28px;height:0;border-top:2px solid var(--ink)}.ln.d{border-top:2px dashed var(--muted)}
label.tg{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;color:var(--ink)}
label.tg input{width:20px;height:20px;accent-color:var(--red)}
.scroll{overflow-x:auto}
.tree{position:relative;width:2300px}
.tree svg{display:block;width:100%;height:auto}
.node{cursor:pointer}.node:focus{outline:none}.node:focus rect.c{stroke-width:3}
.dim{opacity:.16;transition:opacity .15s}
.e{fill:none;stroke:var(--ink);stroke-width:2}.e.s{stroke:var(--muted);stroke-dasharray:5 4;stroke-width:1.5}

#tip{position:absolute;pointer-events:none;max-width:300px;background:var(--card);border:1px solid var(--rule);border-radius:8px;
 padding:10px 12px;font-size:14px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.14);display:none;z-index:2}
#tip b{font:600 17px Oswald,sans-serif}
#np{position:fixed;right:16px;bottom:16px;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 12px 8px 8px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;max-width:560px;transition:opacity .2s}
#np.off{opacity:0;pointer-events:none}#np .v{width:320px;height:180px;border-radius:6px;overflow:hidden;flex:none;background:#000}#np .v iframe{width:320px;height:180px;display:block}
#np b{font:600 15px Oswald,sans-serif;display:block}#np .m{color:var(--muted)}
#gate{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:6;background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 20px;font:600 15px Inter,sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#gate[hidden]{display:none}
#tip .m{color:var(--muted)}#tip .clip{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule)}#tip a{color:var(--red)}#tip.pin{pointer-events:auto}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--muted)}
td.r{text-align:right;font:600 18px Oswald,sans-serif;color:var(--red);white-space:nowrap;width:3em}
td.n{font-weight:600;white-space:nowrap}
.src{font-size:13px;color:var(--muted);max-width:80ch}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}td.n{white-space:normal}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

 ${kids?`<br><span class="m">Influenced:</span> ${esc(kids)}`:''}<br><span class="m">${esc(n.note)}</span>${CLIPS[n.id]?`<div class="clip">♪ ${esc(CLIPS[n.id][2])} · <a href="https://www.youtube.com/watch?v=${CLIPS[n.id][0]}&t=${CLIPS[n.id][1]}s" target="_blank" rel="noopener">YouTube</a></div>`:''}`;
 const tb=tree.getBoundingClientRect(),gb=g.getBoundingClientRect();tip.style.display='block';
 let left=gb.right-tb.left+10;if(left+310>tree.clientWidth)left=gb.left-tb.left-310;
 tip.style.left=Math.max(4,left)+'px';tip.style.top=(gb.top-tb.top)+'px'};
const bind=()=>svg.querySelectorAll('.node').forEach(g=>{
 g.addEventListener('mouseenter',()=>{if(!pinned)show(g)});g.addEventListener('mouseleave',()=>{if(!pinned)clear()});
 g.addEventListener('focus',()=>show(g));g.addEventListener('blur',()=>{if(!pinned)clear()});
 g.addEventListener('click',ev=>{ev.stopPropagation();if(pinned===g){pinned=null;clear()}else{pinned=g;show(g)}tip.classList.toggle('pin',!!pinned)})});
const render=v=>{view=v;N.forEach(n=>Object.assign(n,v==='tree'?n.L:n.T));H=v==='tree'?HL:HT;W=v==='tree'?WL:WT;CW=v==='tree'?172:TW;CH=v==='tree'?50:TH;const SC=v==='tree'?PXY:TPXY;document.getElementById('tree').style.width=W+'px';
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.classList.toggle('tl',v!=='tree');
const axis=[];for(let d=Y0;d<=2010;d+=10){const x=PX+(d-Y0)*SC;axis.push(`<line x1="${x}" x2="${x}" y1="${PY-14}" y2="${H}" stroke="var(--rule)" stroke-width="1"/><text x="${x}" y="${PY-22}" text-anchor="middle" font-family="Oswald,sans-serif" font-size="15" fill="var(--muted)">${d}s</text>`)}
svg.innerHTML=`<g>${axis.join('')}${view!=='tree'?'':`<line x1="${PX}" x2="${W-PX}" y1="${secY-20}" y2="${secY-20}" stroke="var(--muted)" stroke-width="1"/><text x="${PX}" y="${secY-4}" font-family="Oswald,sans-serif" font-size="15" fill="var(--muted)">Other drummers cited as influences (hover a drummer to see these links)</text><line x1="${PX}" x2="${W-PX}" y1="${isoY-20}" y2="${isoY-20}" stroke="var(--muted)" stroke-width="1"/><text x="${PX}" y="${isoY-4}" font-family="Oswald,sans-serif" font-size="15" fill="var(--muted)">No drummer named as an influence in the sources checked</text>`}</g><g id="edges">${E.map((e,i)=>`<path class="e${e.s?' s':''}" data-i="${i}" d="${path(e)}"/>`).join('')}</g><g>${N.map(card).join('')}</g>`;
bind()};
const setView=v=>{pinned=null;clear();render(v);document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));try{history.replaceState(null,'',v==='tl'?'#timeline':location.pathname+location.search)}catch(e){}};
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setView(b.dataset.v)}));
window.addEventListener('hashchange',()=>setView(location.hash==='#timeline'?'tl':'tree'));
setView(location.hash==='#timeline'?'tl':'tree');
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#tip'))return;if(pinned){pinned=null;tip.classList.remove('pin');clear()}});
}
